<text x="1028" y="90" dominant-baseline="text-before-edge" font-family="Inter, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#1A2744">Claude handles it directly</text>
<text x="1028" y="142" dominant-baseline="text-before-edge" font-family="Inter, Noto Sans KR, sans-serif" font-size="21" font-weight="400" fill="#1A2744">fits simple questions and small edits</text>
<line x1="900" y1="140" x2="990" y2="140" stroke="#9AA5B8" stroke-width="3"/>
<polygon points="1000,140 986,132 986,148" fill="#9AA5B8"/>
