<text x="68" y="310" dominant-baseline="text-before-edge" font-family="Inter, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#1A2744">My request</text>
<rect x="470" y="60" width="430" height="160" rx="14" fill="white" stroke="#D5DBE6" stroke-width="1.5"/>
<rect x="470" y="72" width="7" height="136" rx="3" fill="#9AA5B8"/>
<text x="498" y="90" dominant-baseline="text-before-edge" font-family="Inter, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#1A2744">Ask as usual</text>
<text x="498" y="142" dominant-baseline="text-before-edge" font-family="Inter, Noto Sans KR, sans-serif" font-size="21" font-weight="400" fill="#1A2744">just say it</text>
